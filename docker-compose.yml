services:
  postgres:
    image: postgres:16-alpine
    container_name: syncra-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-syncra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-syncra}
      POSTGRES_DB: ${DB_NAME:-syncra}
    volumes:
      - syncra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-syncra} -d ${DB_NAME:-syncra}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syncra-postgres-data:
